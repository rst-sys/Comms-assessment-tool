# The sources the protocols cite.
#
# Seeded from the Source section of each protocol as it stood when the layered
# framework was built. Nothing here was added, and nothing was upgraded: the
# tier, the binding flag and the read status are what the protocol's own author
# wrote, including the admissions that something was paywalled or unopened.
#
# Fields
#   tier            1 binding law · 2 regulator guidance · 3 standards body
#                   4 professional code · 5 peer-reviewed research
#                   6 practitioner or post-incident account
#   binding         whether it has force of law where it applies
#   read_status     read | partly_read | not_opened, as the protocol states
#   last_checked    only where the protocol gives a date; otherwise null
#   review_by       null until the owner sets a cadence; the build warns once set
#
# Element-level `sources:` lists point at these ids. No element carries one yet:
# the existing protocols were written before this registry and their bases are
# marked unclassified until the owner assigns them.

